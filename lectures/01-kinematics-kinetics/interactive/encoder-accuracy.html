<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Optical encoder: resolution is not accuracy</title>

<style>
  :root {
    --charcoal: #2D3748;
    --warmgray: #718096;
    --forest:   #2B6CB0;
    --crimson:  #A51C30;
    --amber:    #D69E2E;
    --orange:   #DD6B20;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: #FFFFFF; color: var(--charcoal);
    font-family: "Linux Libertine O", Libertine, Palatino, Georgia, serif;
    overflow: hidden;
  }
  #stage { position: relative; width: 100%; height: 100%; }
  canvas { display: block; width: 100%; height: 100%; }

  #panel {
    position: absolute; top: 8px; left: 8px; width: 250px;
    padding: 6px 9px; font-size: 10.5px; line-height: 1.35;
    font-family: system-ui, -apple-system, sans-serif;
  }
  #panel label { display: block; }
  #panel .grp { margin-top: 5px; padding-top: 4px; border-top: 1px solid #EDF2F7; }
  #panel .grp:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
  #panel .hd { font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.04em;
               color: var(--warmgray); margin-bottom: 2px; }
  #panel input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 110px; height: 14px; margin: 0 3px; padding: 0;
    vertical-align: middle; background: transparent; cursor: pointer;
  }
  #panel input[type=range]::-webkit-slider-runnable-track { height: 3px; border-radius: 2px; background: #CBD5E0; }
  #panel input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 14px; height: 14px; margin-top: -5.5px;
    border-radius: 50%; border: none; background: var(--charcoal);
  }
  #panel input[type=range]::-moz-range-track { height: 3px; border-radius: 2px; background: #CBD5E0; }
  #panel input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border: none; border-radius: 50%; background: var(--charcoal); }
  #panel .sl { margin-bottom: 3px; white-space: nowrap; }
  #panel .k { display: inline-block; width: 5.6em; font-family: "Linux Libertine O", Georgia, serif; font-size: 11px; }
  #panel .k i { font-style: italic; }
  #panel .val { display: inline-block; width: 4.4em; text-align: right; font-variant-numeric: tabular-nums; }
  #panel .rad { display: flex; align-items: flex-start; margin: 1px 0; }
  #panel .rad input { width: 11px; height: 11px; flex: none; margin: 2px 4px 0 0; }
  #panel button {
    font: inherit; font-size: 10px; padding: 1px 6px; margin: 3px 4px 0 0;
    border: 1px solid #CBD5E0; border-radius: 3px; background: #fff; color: var(--charcoal); cursor: pointer;
  }
  #tab { border-collapse: collapse; margin-top: 2px; }
  #tab td { padding: 0 7px 0 0; font-variant-numeric: tabular-nums; white-space: nowrap; line-height: 1.45; }
  #tab td.n { text-align: right; min-width: 4.6em; }
  #tab td.lab { font-family: "Linux Libertine O", Georgia, serif; font-size: 11.5px; }
  #tab tr.e td { color: var(--crimson); }
  #tab tr.t td { color: var(--charcoal); }
  #tab tr.a td { color: var(--amber); }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>

  <div id="panel">
    <div class="grp">
      <div class="hd">the wheel</div>
      <label class="sl"><span class="k">slots <i>N</i></span>
        <input type="range" id="sN" min="8" max="64" step="4" value="16">
        <span class="val" id="vN">16</span></label>
      <label class="sl"><span class="k">off-centre <i>e/r</i></span>
        <input type="range" id="se" min="0" max="5" step="0.25" value="0">
        <span class="val" id="ve">0.0 %</span></label>
      <label class="sl"><span class="k">speed <i>&omega;</i></span>
        <input type="range" id="sw" min="10" max="90" step="5" value="45">
        <span class="val" id="vw">45 °/s</span></label>
    </div>

    <div class="grp">
      <div class="hd">steps per slot</div>
      <label class="rad"><input type="radio" name="K" value="1"><span>x1: one edge per slot</span></label>
      <label class="rad"><input type="radio" name="K" value="4" checked><span>x4: quadrature edges</span></label>
      <label class="rad"><input type="radio" name="K" value="16"><span>x16: sine-like A and B, interpolated</span></label>
      <label class="rad"><input type="radio" name="K" value="64"><span>x64: the same, interpolated finer</span></label>
    </div>

    <div class="grp">
      <div class="hd">two different numbers</div>
      <table id="tab">
        <tr class="t"><td class="lab">resolution, one step</td><td class="n" id="tres">0.00</td><td>&deg;</td></tr>
        <tr class="a"><td class="lab">off-centre error, <i>e/r</i></td><td class="n" id="tecc">0.00</td><td>&deg;</td></tr>
        <tr class="e"><td class="lab">accuracy, largest error seen</td><td class="n" id="tacc">0.00</td><td>&deg;</td></tr>
      </table>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var stage  = document.getElementById("stage");
  var canvas = document.getElementById("cv");
  var ctx    = canvas.getContext("2d");

  var COL = { disc: "#2D3748", slot: "#FFFFFF", hub: "#E2E8F0", edge: "#718096", grid: "#EDF2F7", text: "#718096",
              det: "#2B6CB0", led: "#DD6B20", tru: "#D69E2E", est: "#F56565", err: "#A51C30", sine: "#2B6CB0", cosine: "#A51C30" };
  var D = Math.PI / 180;
  var FSIM = 2000;
  var TR = 200, TURNS = 1.0;        // the error plot keeps the last full turn

  // ---- state ---------------------------------------------------------
  var P = { N: 16, e: 0, w: 45, K: 4 };
  var th = 0, last = performance.now(), acc = 0;
  var trN = 4000, trTh = new Float32Array(trN), trE = new Float32Array(trN), trI = 0, trCount = 0, trAcc = 0;

  function pitch() { return 2 * Math.PI / P.N; }
  function stepRad() { return pitch() / P.K; }

  // ---- the geometry of an off-centre wheel ------------------------------
  // The shaft axis is the origin. The wheel's own centre C sits a distance e
  // from it and turns with the shaft. The slot track is a circle of radius r
  // about C. Detector A is fixed to the housing at (r, 0). What A reads is
  // the track angle under it, measured about C, not about the shaft.
  var R1 = 1.0;                                      // track radius, units of r
  function centre(t) { var e = P.e / 100; return { x: e * Math.cos(t + Math.PI / 2), y: e * Math.sin(t + Math.PI / 2) }; }
  function trackAngleUnderA(t) {
    var c = centre(t);
    var alpha = Math.atan2(0 - c.y, R1 - c.x);       // direction of A as seen from the wheel's centre
    return alpha - t;                                // the wheel has turned by t, so the track angle under A
  }
  // the encoder's reading: the track angle under A, unwrapped, held to the last step
  var psiPrev = 0, psiUnwrapped = 0;
  function reading(t) {
    var psi = trackAngleUnderA(t);
    var d = psi - psiPrev; d = Math.atan2(Math.sin(d), Math.cos(d));   // small change since the last sample
    psiUnwrapped += d; psiPrev = psi;
    var u = -psiUnwrapped;                           // grows with the shaft angle
    var q = stepRad();
    return Math.floor(u / q) * q;
  }

  function fmt(v, n) { if (Math.abs(v) < 5e-4) v = 0; return v.toFixed(n === undefined ? 2 : n); }
  function wrap(a) { return Math.atan2(Math.sin(a), Math.cos(a)); }

  var est = 0, emax = 0;
  function step(dt) {
    th += P.w * D * dt;
    est = reading(th);
  }
  function record() {
    var e = wrap(est - th);
    trTh[trI] = th; trE[trI] = e; trI = (trI + 1) % trN; trCount = Math.min(trCount + 1, trN);
  }
  function reset() {
    th = 0; psiPrev = trackAngleUnderA(0); psiUnwrapped = psiPrev; est = reading(0); trCount = 0; trI = 0; emax = 0;
  }

  // ---- drawing helpers -------------------------------------------------
  function text(s, x, y, color, size, align, italic) {
    ctx.save(); ctx.fillStyle = color;
    ctx.font = (italic ? "italic " : "") + (size || 12) + 'px "Linux Libertine O", Georgia, serif';
    ctx.textAlign = align || "left"; ctx.textBaseline = "middle"; ctx.fillText(s, x, y); ctx.restore();
  }
  function arrow(x0, y0, x1, y1, color, width) {
    var L = Math.hypot(x1 - x0, y1 - y0); if (L < 2) return;
    ctx.save(); ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = width; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    var ang = Math.atan2(y1 - y0, x1 - x0), h = Math.min(9, L), w = 0.42;
    ctx.beginPath(); ctx.moveTo(x1, y1);
    ctx.lineTo(x1 - h * Math.cos(ang - w), y1 - h * Math.sin(ang - w));
    ctx.lineTo(x1 - h * Math.cos(ang + w), y1 - h * Math.sin(ang + w));
    ctx.closePath(); ctx.fill(); ctx.restore();
  }

  function drawWheel(cx, cy, R) {
    // R px is the track radius r. Eccentricity is exaggerated on screen by a factor so it can be seen.
    var EX = 6;                                      // screen exaggeration of e
    var p = pitch(), c = centre(th);
    var wx = cx + EX * R * c.x, wy = cy - EX * R * c.y;   // the wheel's centre on screen
    var Ro = R * 1.19, Rh = R * 0.3, sw = R * 0.14;
    ctx.save();
    ctx.fillStyle = COL.disc; ctx.beginPath(); ctx.arc(wx, wy, Ro, 0, 2 * Math.PI); ctx.fill();
    ctx.fillStyle = COL.slot;
    for (var i = 0; i < P.N; i++) {
      var a0 = i * p + th, a1 = a0 + p / 2;
      ctx.beginPath(); ctx.arc(wx, wy, R + sw, -a0, -a1, true); ctx.arc(wx, wy, R - sw, -a1, -a0, false); ctx.closePath(); ctx.fill();
    }
    // the wheel's own centre, and the shaft axis it should be on
    ctx.fillStyle = COL.hub; ctx.beginPath(); ctx.arc(wx, wy, Rh, 0, 2 * Math.PI); ctx.fill();
    ctx.strokeStyle = COL.edge; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = COL.edge; ctx.beginPath(); ctx.arc(wx, wy, 2.5, 0, 2 * Math.PI); ctx.fill();
    ctx.strokeStyle = COL.err; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(cx - 7, cy); ctx.lineTo(cx + 7, cy); ctx.moveTo(cx, cy - 7); ctx.lineTo(cx, cy + 7); ctx.stroke();
    if (P.e > 0) { ctx.strokeStyle = COL.err; ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(wx, wy); ctx.stroke(); ctx.setLineDash([]); }
    // detector A, fixed to the housing at (r, 0) from the shaft axis; shown through the slot, LED on top
    var ax = cx + R, ay = cy;
    var slotW = 2 * R * Math.sin(p / 4), rd = Math.min(R * 0.1, 0.45 * slotW), rl = 0.58 * rd;
    ctx.save();
    ctx.beginPath();
    for (i = 0; i < P.N; i++) {
      a0 = i * p + th; a1 = a0 + p / 2;
      ctx.moveTo(wx + (R + sw) * Math.cos(-a0), wy + (R + sw) * Math.sin(-a0));
      ctx.arc(wx, wy, R + sw, -a0, -a1, true); ctx.arc(wx, wy, R - sw, -a1, -a0, false); ctx.closePath();
    }
    ctx.clip();
    ctx.fillStyle = COL.det; ctx.beginPath(); ctx.arc(ax, ay, rd, 0, 2 * Math.PI); ctx.fill();
    ctx.restore();
    ctx.fillStyle = COL.led; ctx.beginPath(); ctx.arc(ax, ay, rl, 0, 2 * Math.PI); ctx.fill();
    text("A", ax + rd + 6, ay, COL.det, 13, "left");
    ctx.restore();
    // true and read angles, as arrows from the shaft axis
    var L = R * 0.6;
    arrow(cx, cy, cx + L * Math.cos(-th), cy + L * Math.sin(-th), COL.tru, 2.4);
    arrow(cx, cy, cx + L * Math.cos(-est), cy + L * Math.sin(-est), COL.est, 1.8);
    text("shaft axis +, wheel centre •", cx, cy + Ro + 16, COL.text, 11, "center");
    text(P.e > 0 ? "off-centre by e, drawn " + EX + "× too big" : "wheel centred on the shaft", cx, cy + Ro + 30, COL.text, 11, "center");
  }

  function drawError(x0, y0, w, h) {
    // error against the true angle, last full turn
    var q = stepRad() / D, ecc = P.e / 100 / D;
    var scale = Math.max(q, ecc + q) * 1.3;
    ctx.save();
    ctx.strokeStyle = COL.grid; ctx.lineWidth = 1;
    [-1, 0, 1].forEach(function (f) {
      var y = y0 + h / 2 - f * h / 2 / 1.3;
      ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x0 + w, y); ctx.stroke();
      text((f > 0 ? "+" : "") + fmt(f * scale / 1.3, 2) + "°", x0 - 6, y, COL.text, 10.5, "right");
    });
    text("0°", x0, y0 + h + 10, COL.text, 10.5, "left"); text("360°", x0 + w, y0 + h + 10, COL.text, 10.5, "right");
    // the predicted off-centre error, (e/r) sin, as a thin amber line
    if (P.e > 0) {
      ctx.strokeStyle = COL.tru; ctx.lineWidth = 1.2; ctx.beginPath();
      for (var i = 0; i <= 180; i++) {
        var a = i / 180 * 2 * Math.PI, v = (P.e / 100) * Math.cos(a) / D;   // -alpha, to first order in e
        var x = x0 + w * i / 180, y = y0 + h / 2 - (h / 2) * v / scale;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    // the samples of the last turn
    ctx.fillStyle = COL.err;
    var n = trCount, start = (trI - n + trN) % trN, thNow = th;
    emax = 0;
    for (i = 0; i < n; i++) {
      var k = (start + i) % trN;
      if (thNow - trTh[k] > 2 * Math.PI * TURNS) continue;
      var u = ((trTh[k] % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
      var ex = x0 + w * u / (2 * Math.PI), ey = y0 + h / 2 - (h / 2) * (trE[k] / D) / scale;
      ctx.fillRect(ex - 0.7, ey - 0.7, 1.4, 1.4);
      emax = Math.max(emax, Math.abs(trE[k] / D));
    }
    text("read minus true, against the true angle, last turn", x0 + 4, y0 - 9, COL.text, 11, "left");
    text("red: what the encoder reports. amber: the off-centre error alone, (e/r) sin θ", x0 + w, y0 + h + 24, COL.text, 10.5, "right");
    ctx.restore();
  }

  function drawSines(x0, y0, w, h) {
    // what fine slits give: sine-like A and B over two slots, and the point they define on a circle
    var p = pitch(), psi = -trackAngleUnderA(th);
    var cx = x0 + w - h * 0.55, cy = y0 + h / 2, r = h * 0.4, w1 = w - h * 1.3;
    ctx.save();
    ctx.strokeStyle = COL.grid; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x0, cy); ctx.lineTo(x0 + w1, cy); ctx.stroke();
    [[COL.cosine, 0], [COL.sine, -Math.PI / 2]].forEach(function (s) {
      ctx.strokeStyle = s[0]; ctx.lineWidth = 1.6; ctx.beginPath();
      for (var i = 0; i <= 200; i++) {
        var u = i / 200 * 2, v = Math.cos(2 * Math.PI * u + s[1]);
        var x = x0 + w1 * i / 200, y = cy - r * v;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    });
    // the present position within the slot
    var frac = ((psi / p) % 2 + 2) % 2, xm = x0 + w1 * frac / 2;
    ctx.strokeStyle = COL.text; ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.moveTo(xm, y0); ctx.lineTo(xm, y0 + h); ctx.stroke(); ctx.setLineDash([]);
    text("A", x0 + w1 + 6, cy - r, COL.cosine, 12, "left"); text("B", x0 + w1 + 6, cy + r, COL.sine, 12, "left");
    text("two slots", x0 + w1, y0 + h + 10, COL.text, 10.5, "right");
    // circle
    ctx.strokeStyle = COL.grid; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 2 * Math.PI); ctx.stroke();
    var ang = 2 * Math.PI * frac;
    ctx.strokeStyle = COL.tru; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + r * Math.cos(-ang), cy + r * Math.sin(-ang)); ctx.stroke();
    ctx.fillStyle = COL.tru; ctx.beginPath(); ctx.arc(cx + r * Math.cos(-ang), cy + r * Math.sin(-ang), 3.5, 0, 2 * Math.PI); ctx.fill();
    // the K steps as ticks on the circle
    ctx.strokeStyle = COL.edge; ctx.lineWidth = 1;
    for (var k = 0; k < P.K; k++) { var t = 2 * Math.PI * k / P.K; ctx.beginPath(); ctx.moveTo(cx + r * 0.9 * Math.cos(t), cy + r * 0.9 * Math.sin(t)); ctx.lineTo(cx + r * Math.cos(t), cy + r * Math.sin(t)); ctx.stroke(); }
    text("atan2(B, A): " + P.K + " steps per slot", cx, cy + r + 12, COL.text, 10.5, "center");
    text("fine slits give sine-like A and B, not square waves", x0 + 4, y0 - 9, COL.text, 11, "left");
    ctx.restore();
  }

  // ---- draw -----------------------------------------------------------
  function draw() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);
    var panel  = document.getElementById("panel");
    var panelW = panel.offsetWidth + 16;
    var RH = Math.max(110, Math.min(150, H * 0.26));
    var rowTop = H - 40 - RH;
    var ax0 = panelW, ax1 = W - 10, ay0 = 10, ay1 = rowTop - 16;
    var R = Math.min((ay1 - ay0) * 0.34, (ax1 - ax0) * 0.16);
    var cx = ax0 + R * 1.5 + 20, cy = (ay0 + ay1) / 2 - 10;
    drawWheel(cx, cy, R);
    var ex0 = cx + R * 1.5 + 70, ew = ax1 - ex0 - 10;
    drawError(ex0, ay0 + 22, ew, ay1 - ay0 - 60);
    var bx0 = 48, bw = W - bx0 - 12;
    drawSines(bx0, rowTop + 14, bw, RH - 24);

    document.getElementById("tres").textContent = fmt(stepRad() / D, 3);
    document.getElementById("tecc").textContent = fmt(P.e / 100 / D, 2);
    document.getElementById("tacc").textContent = fmt(emax, 2);
  }

  function tick(now) {
    var dt = Math.min(0.1, (now - last) / 1000); last = now;
    acc += dt;
    var hh = 1 / FSIM;
    while (acc >= hh) {
      step(hh); acc -= hh; trAcc += hh;
      if (trAcc >= 1 / TR) { trAcc -= 1 / TR; record(); }
    }
    draw();
    requestAnimationFrame(tick);
  }

  // ---- controls ---------------------------------------------------------
  var SPEC = { N: ["sN", "vN", function (v) { return v; }],
               e: ["se", "ve", function (v) { return fmt(v, 1) + " %"; }],
               w: ["sw", "vw", function (v) { return v + " °/s"; }] };
  function show(key) { document.getElementById(SPEC[key][1]).textContent = SPEC[key][2](P[key]); }
  Object.keys(SPEC).forEach(function (key) {
    var el = document.getElementById(SPEC[key][0]);
    el.addEventListener("input", function () { P[key] = parseFloat(el.value); show(key); if (key !== "w") reset(); });
    show(key);
  });
  Array.prototype.forEach.call(document.querySelectorAll('input[name="K"]'), function (el) {
    el.addEventListener("change", function () { P.K = parseInt(el.value, 10); reset(); });
  });

  // URL presets: ?N=16&e=0&w=45&K=4
  (function () {
    var q = new URLSearchParams(location.search);
    Object.keys(SPEC).forEach(function (key) {
      if (!q.has(key)) return;
      var v = parseFloat(q.get(key)); if (!isFinite(v)) return;
      var el = document.getElementById(SPEC[key][0]);
      v = Math.max(parseFloat(el.min), Math.min(parseFloat(el.max), v));
      P[key] = v; el.value = v; show(key);
    });
    if (q.has("K")) {
      var k = parseInt(q.get("K"), 10);
      if ([1, 4, 16, 64].indexOf(k) >= 0) { P.K = k; document.querySelector('input[name="K"][value="' + k + '"]').checked = true; }
    }
  })();

  // ---- sizing ---------------------------------------------------------
  var W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = window.devicePixelRatio || 1;
    W = stage.clientWidth; H = stage.clientHeight;
    canvas.width  = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    draw();
  }
  window.addEventListener("resize", resize);
  reset();
  resize();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
