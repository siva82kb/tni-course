<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="https://cdn.plot.ly/plotly-2.32.0.min.js" charset="utf-8"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #ffffff;
    color: #2D3748;
    padding: 0.6rem 1rem 0.4rem;
    height: 100vh;
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }
  #controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    font-size: 0.72rem;
  }
  .ctrl { display: flex; align-items: center; gap: 0.3rem; }
  .ctrl label { color: #718096; font-weight: 600; white-space: nowrap; }
  input[type="range"] { width: 70px; cursor: pointer; height: 3px; }
  #bias-slider  { accent-color: #A51C30; }
  #n-slider     { accent-color: #2B6CB0; }
  #bin-slider   { accent-color: #276749; }
  #noise-slider { accent-color: #744210; }
  .val { font-weight: 700; min-width: 1.8rem; }
  .val-bias  { color: #A51C30; }
  .val-n     { color: #2B6CB0; }
  .val-bin   { color: #276749; }
  .val-noise { color: #744210; }
  .unit { color: #A0AEC0; font-size: 0.68rem; }
  #remeasure-btn {
    padding: 0.15rem 0.6rem;
    background: #2B6CB0; color: #fff;
    border: none; border-radius: 4px;
    font-size: 0.72rem; font-weight: 600;
    cursor: pointer; white-space: nowrap;
  }
  #remeasure-btn:hover { background: #2c5282; }
  #plot { flex: 1; min-height: 0; }
  .readout {
    display: flex; gap: 1.5rem; font-size: 0.72rem;
    justify-content: center; padding-bottom: 0.1rem;
  }
  .readout span { color: #718096; }
  .r-true  { color: #A51C30 !important; font-weight: 700; }
  .r-mean  { color: #1A202C !important; font-weight: 700; }
  .r-error { color: #276749 !important; font-weight: 700; }
</style>
</head>
<body>

<div id="controls">
  <div class="ctrl">
    <label>N measurements</label>
    <input type="range" id="n-slider" min="1" max="100" step="1" value="20">
    <span id="n-val" class="val val-n">20</span>
  </div>
  <div class="ctrl">
    <label>Bin width</label>
    <input type="range" id="bin-slider" min="0.05" max="0.5" step="0.05" value="0.15">
    <span id="bin-val" class="val val-bin">0.15</span>
    <span class="unit">°C</span>
  </div>
  <div class="ctrl">
    <button id="remeasure-btn">Remeasure</button>
  </div>
  <div class="ctrl">
    <label>Noise (σ)</label>
    <input type="range" id="noise-slider" min="0.05" max="0.75" step="0.05" value="0.25">
    <span id="noise-val" class="val val-noise">0.25</span>
    <span class="unit">°C</span>
  </div>
  <div class="ctrl">
    <label>Systematic bias</label>
    <input type="range" id="bias-slider" min="-1.0" max="1.0" step="0.05" value="0">
    <span id="bias-val" class="val val-bias">0.00</span>
    <span class="unit">°C</span>
  </div>
</div>

<div id="plot"></div>

<div class="readout">
  <div><span>True value: </span><strong class="r-true">37.00 °C</strong></div>
  <div><span>Sample mean: </span><strong class="r-mean" id="mean-val">—</strong></div>
  <div><span>Error (mean − true): </span><strong class="r-error" id="err-val">—</strong></div>
</div>

<script>
const TRUE_TEMP = 37.0;
const X_MIN = 35.5, X_MAX = 38.5;
const MAX_N = 100;
let SIGMA = 0.25;

// Panel y-domains (bottom → top): strip, histogram, boxplot, mean±std
const D_STRIP = [0.00, 0.10];
const D_HIST  = [0.14, 0.54];
const D_BOX   = [0.57, 0.74];
const D_MEAN  = [0.76, 1.00];

function seededRand(seed) {
  let s = seed;
  return () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
}
function gaussNoise(rng) {
  const u1 = Math.max(rng(), 1e-10), u2 = rng();
  return Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
}

let sampleSeed = 42;
let noisePool  = resample();

function resample() {
  const rng = seededRand(sampleSeed);
  return Array.from({length: MAX_N}, () => gaussNoise(rng));
}

const cfg = { displayModeBar: false, responsive: true };

const TICK_SIZE = 13;
const xAxisBase = {
  range: [X_MIN, X_MAX],
  showgrid: false, linecolor: '#CBD5E0', zerolinecolor: '#CBD5E0',
  tickfont: { color: '#4A5568', size: TICK_SIZE },
};

function update() {
  const N       = parseInt(document.getElementById('n-slider').value);
  const binSize = parseFloat(document.getElementById('bin-slider').value);
  const bias    = parseFloat(document.getElementById('bias-slider').value);
  SIGMA         = parseFloat(document.getElementById('noise-slider').value);

  document.getElementById('n-val').textContent     = N;
  document.getElementById('bin-val').textContent   = binSize.toFixed(2);
  document.getElementById('bias-val').textContent  = bias.toFixed(2);
  document.getElementById('noise-val').textContent = SIGMA.toFixed(2);

  const xs  = noisePool.slice(0, N).map(n => TRUE_TEMP + bias + SIGMA * n);
  const mean = xs.reduce((a, b) => a + b, 0) / N;
  const std  = Math.sqrt(xs.reduce((s, x) => s + (x - mean) ** 2, 0) / N);
  const err  = mean - TRUE_TEMP;

  document.getElementById('mean-val').textContent = mean.toFixed(2) + ' °C';
  document.getElementById('err-val').textContent  = (err >= 0 ? '+' : '') + err.toFixed(2) + ' °C';

  // Vertical reference lines spanning full paper
  const shapes = [
    {
      type: 'line', xref: 'x', yref: 'paper',
      x0: TRUE_TEMP, x1: TRUE_TEMP, y0: 0, y1: 1,
      line: { color: '#A51C30', width: 1.0, dash: 'dot' },
    },
    {
      type: 'line', xref: 'x', yref: 'paper',
      x0: mean, x1: mean, y0: 0, y1: 1,
      line: { color: '#1A202C', width: 1.0, dash: 'dot' },
    },
  ];

  const traces = [
    // ── Strip plot ──────────────────────────────────────────
    {
      x: [X_MIN, X_MAX], y: [0, 0],
      type: 'scatter', mode: 'lines',
      line: { color: '#CBD5E0', width: 1.5 },
      hoverinfo: 'skip', showlegend: false,
      xaxis: 'x', yaxis: 'y',
    },
    {
      x: xs, y: Array(N).fill(0),
      type: 'scatter', mode: 'markers',
      marker: { color: '#2B6CB0', size: 7, symbol: 'circle-open', line: { width: 1.2 } },
      name: 'Measurements',
      hovertemplate: '%{x:.2f} °C<extra></extra>',
      xaxis: 'x', yaxis: 'y',
    },

    // ── Histogram ───────────────────────────────────────────
    {
      x: xs,
      type: 'histogram',
      xbins: { start: X_MIN, end: X_MAX, size: binSize },
      marker: { color: 'rgba(43,108,176,0.40)', line: { color: '#2B6CB0', width: 0.6 } },
      showlegend: false,
      hovertemplate: '%{x:.2f} °C  n=%{y}<extra></extra>',
      xaxis: 'x', yaxis: 'y2',
    },

    // ── Box plot ─────────────────────────────────────────────
    {
      x: xs,
      type: 'box',
      orientation: 'h',
      marker: { color: '#2B6CB0', size: 5 },
      line: { color: '#2B6CB0', width: 0.8 },
      fillcolor: 'rgba(43,108,176,0.20)',
      boxmean: false,
      name: '',
      showlegend: false,
      hovertemplate: 'Q1=%{q1:.2f}  median=%{median:.2f}  Q3=%{q3:.2f}<extra></extra>',
      xaxis: 'x', yaxis: 'y3',
    },

    // ── Mean ± std ───────────────────────────────────────────
    {
      x: [mean], y: [0],
      type: 'scatter', mode: 'markers',
      marker: { color: '#1A202C', size: 7, symbol: 'circle' },
      error_x: { type: 'constant', value: std, color: '#1A202C', thickness: 1, width: 5 },
      name: 'Mean ± SD',
      showlegend: false,
      hovertemplate: `mean=${mean.toFixed(2)}  sd=${std.toFixed(2)}<extra></extra>`,
      xaxis: 'x', yaxis: 'y4',
    },

    // ── Legend proxies for vertical lines ───────────────────
    {
      x: [null], y: [null], type: 'scatter', mode: 'lines',
      line: { color: '#A51C30', width: 1.0, dash: 'dot' },
      name: 'True value', xaxis: 'x', yaxis: 'y',
    },
    {
      x: [null], y: [null], type: 'scatter', mode: 'lines',
      line: { color: '#1A202C', width: 1.0 },
      name: 'Sample mean', xaxis: 'x', yaxis: 'y',
    },
  ];

  const layout = {
    margin: { l: 45, r: 20, t: 10, b: 55 },
    xaxis: { ...xAxisBase, title: { text: 'Temperature  (°C)', font: { size: 13, color: '#4A5568' } } },

    // Strip
    yaxis:  { domain: D_STRIP, range: [-0.5, 0.5], showgrid: false, showline: false, zeroline: false, showticklabels: false },
    // Histogram
    yaxis2: { domain: D_HIST,  title: { text: 'Count', font: { size: 11, color: '#4A5568' } }, showgrid: false, linecolor: '#CBD5E0', zeroline: false, tickfont: { color: '#718096', size: TICK_SIZE } },
    // Box plot
    yaxis3: { domain: D_BOX,  showgrid: false, showline: false, zeroline: false, showticklabels: false },
    // Mean ± std
    yaxis4: { domain: D_MEAN, showgrid: false, showline: false, zeroline: false, showticklabels: false },

    plot_bgcolor: '#ffffff', paper_bgcolor: '#ffffff',
    showlegend: true,
    legend: {
      orientation: 'h', x: 0.5, xanchor: 'center', y: 1.06,
      bgcolor: 'rgba(255,255,255,0.85)', font: { size: 11, color: '#4A5568' },
    },
    shapes,
    hovermode: 'closest',
    font: { family: 'Segoe UI, system-ui, sans-serif' },
  };

  Plotly.react('plot', traces, layout, cfg);
}

update();
document.getElementById('n-slider').addEventListener('input', update);
document.getElementById('bin-slider').addEventListener('input', update);
document.getElementById('noise-slider').addEventListener('input', update);
document.getElementById('bias-slider').addEventListener('input', update);
document.getElementById('remeasure-btn').addEventListener('click', () => {
  sampleSeed = (sampleSeed * 1664525 + 1013904223) & 0x7fffffff;
  noisePool  = resample();
  update();
});
</script>
</body>
</html>
