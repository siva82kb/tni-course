<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quadrature decoder: the state machine, live</title>

<style>
  :root {
    --charcoal: #2D3748;
    --warmgray: #718096;
    --forest:   #2B6CB0;
    --crimson:  #A51C30;
    --amber:    #D69E2E;
    --orange:   #DD6B20;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: #FFFFFF; color: var(--charcoal);
    font-family: "Linux Libertine O", Libertine, Palatino, Georgia, serif;
    overflow: hidden;
  }
  #stage { position: relative; width: 100%; height: 100%; }
  #stage.grab { cursor: grab; }
  #stage.grabbing { cursor: grabbing; }
  #panel input[type=range]:disabled { opacity: 0.35; cursor: default; }
  canvas { display: block; width: 100%; height: 100%; }

  #panel {
    position: absolute; top: 8px; left: 8px; width: 250px;
    padding: 6px 9px; font-size: 10.5px; line-height: 1.35;
    font-family: system-ui, -apple-system, sans-serif;
  }
  #panel label { display: block; }
  #panel .grp { margin-top: 5px; padding-top: 4px; border-top: 1px solid #EDF2F7; }
  #panel .grp:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
  #panel .hd { font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.04em;
               color: var(--warmgray); margin-bottom: 2px; }
  #panel input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 110px; height: 14px; margin: 0 3px; padding: 0;
    vertical-align: middle; background: transparent; cursor: pointer;
  }
  #panel input[type=range]::-webkit-slider-runnable-track { height: 3px; border-radius: 2px; background: #CBD5E0; }
  #panel input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 14px; height: 14px; margin-top: -5.5px;
    border-radius: 50%; border: none; background: var(--charcoal);
  }
  #panel input[type=range]::-moz-range-track { height: 3px; border-radius: 2px; background: #CBD5E0; }
  #panel input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border: none; border-radius: 50%; background: var(--charcoal); }
  #panel .sl { margin-bottom: 3px; white-space: nowrap; }
  #panel .k { display: inline-block; width: 5.6em; font-family: "Linux Libertine O", Georgia, serif; font-size: 11px; }
  #panel .k i { font-style: italic; }
  #panel .val { display: inline-block; width: 4.4em; text-align: right; font-variant-numeric: tabular-nums; }
  #panel .rad { display: flex; align-items: flex-start; margin: 1px 0; }
  #panel .rad input { width: 11px; height: 11px; flex: none; margin: 2px 4px 0 0; }
  #panel button {
    font: inherit; font-size: 10px; padding: 1px 6px; margin: 3px 4px 0 0;
    border: 1px solid #CBD5E0; border-radius: 3px; background: #fff; color: var(--charcoal); cursor: pointer;
  }
  #tab { border-collapse: collapse; margin-top: 2px; }
  #tab td { padding: 0 7px 0 0; font-variant-numeric: tabular-nums; white-space: nowrap; line-height: 1.45; }
  #tab td.n { text-align: right; min-width: 4.6em; }
  #tab td.lab { font-family: "Linux Libertine O", Georgia, serif; font-size: 11.5px; }
  #tab tr.e td { color: var(--crimson); }
  #tab tr.t td { color: var(--charcoal); }

  #legend {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 18px; font-size: 12.5px; white-space: nowrap;
  }
  #legend span::before {
    content: ""; display: inline-block; width: 18px; height: 0; vertical-align: middle;
    margin-right: 5px; border-top: 2.4px solid currentColor;
  }
  #legend .t { color: var(--amber); }
  #legend .e { color: #F56565; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>

  <div id="panel">
    <div class="grp">
      <div class="hd">the wheel</div>
      <label class="sl"><span class="k">Slots <i>N</i></span>
        <input type="range" id="sN" min="4" max="48" step="2" value="16">
        <span class="val" id="vN">16</span></label>
      <label class="rad"><input type="radio" name="drive" value="motor" checked><span>Motor: turns at a set speed</span></label>
      <label class="rad"><input type="radio" name="drive" value="hand"><span>By hand: drag the wheel or use the angle slider</span></label>
      <label class="sl"><span class="k">Speed <i>&omega;</i></span>
        <input type="range" id="sw" min="-90" max="90" step="1" value="45">
        <span class="val" id="vw">45 °/s</span></label>
      <label class="sl"><span class="k">Angle <i>&theta;</i></span>
        <input type="range" id="sp" min="-720" max="720" step="0.5" value="0" disabled>
        <span class="val" id="vp">0.0 °</span></label>
      <button id="stop">Stop</button><button id="rev">Reverse</button>
    </div>

    <div class="grp">
      <div class="hd">the counter</div>
      <label class="rad"><input type="checkbox" id="cz"><span>Reset the count when Z passes</span></label>
      <button id="drop">Miss one edge</button><button id="zero">Zero the count</button>
    </div>

    <div class="grp">
      <div class="hd">what the counter knows</div>
      <table id="tab">
        <tr class="t"><td class="lab">Wheel angle</td><td class="n" id="tth">0.0</td><td>&deg;</td></tr>
        <tr class="t"><td class="lab">Encoder angle</td><td class="n" id="tq">0.0</td><td>&deg;</td></tr>
        <tr class="t"><td class="lab">Difference</td><td class="n" id="terr">0.0</td><td>&deg;</td></tr>
        <tr class="t"><td class="lab">One count, a quarter pitch</td><td class="n" id="tres">0.0</td><td>&deg;</td></tr>
        <tr class="t"><td class="lab">Count</td><td class="n" id="tc">0</td><td></td></tr>
        <tr class="e"><td class="lab">Errors flagged by the decoder</td><td class="n" id="tmiss">0</td><td></td></tr>
      </table>
    </div>
  </div>


</div>

<script>
(function () {
  "use strict";

  var stage  = document.getElementById("stage");
  var canvas = document.getElementById("cv");
  var ctx    = canvas.getContext("2d");

  // the palette of the tikz figures
  var COL = { disc: "#2D3748", slot: "#FFFFFF", hub: "#E2E8F0", edge: "#718096", grid: "#EDF2F7",
              text: "#718096", det: "#2B6CB0", led: "#DD6B20", off: "#CBD5E0",
              tru: "#D69E2E", est: "#F56565", amber: "#D69E2E" };   // arrow and plot colours: amber for the true angle, light red for the count
  var D = Math.PI / 180;
  var FSIM = 4000;                 // internal steps per second, so the simulation itself misses no edge
  var WIN  = 10.0;                 // seconds of trace shown

  // ---- state ---------------------------------------------------------
  var P = { N: 16, w: 45, mode: 4, zres: false };
  var th = 0;                      // true angle, rad, unwrapped
  var drive = "motor", thT = 0;     // by hand: the angle the wheel is being moved to
  var wheel = { cx: 0, cy: 0, R: 1 }, grab = null;
  var count = 0, missed = 0, dropPending = 0;
  var A = 0, B = 0, Z = 0;         // detector states
  var sA = 0, sB = 0;              // the state the decoder last saw: it differs from A, B after a missed edge
  var trans = null;                // the last transition the decoder took: { from, to, dir (+1, -1, 0 = missed), t }
  var evt = 0;                     // the decoder event since the last trace sample: +1, -1, or 2 for a missed edge
  var last = performance.now(), acc = 0;
  var TR = 200;                    // trace samples per second
  var trN = Math.round(WIN * TR);
  var trA = new Float32Array(trN), trB = new Float32Array(trN), trZ = new Float32Array(trN), trS = new Int8Array(trN);
  var trT = new Float32Array(trN), trQ = new Float32Array(trN), trE = new Float32Array(trN), trI = 0, trAcc = 0;

  // ---- the wheel, as in the figures --------------------------------------
  // Slots are half the pitch wide, so one channel sees a 50 % duty cycle.
  // The index window on the inner track is also half a pitch wide.
  // Detector A sits at the reference; B sits one pitch and a quarter further
  // round, which is electrically the same as a quarter pitch.
  function pitch() { return 2 * Math.PI / P.N; }
  function offB() { return 1.25 * pitch(); }
  function open(angle) {
    var p = pitch(), u = ((angle % p) + p) % p;
    return u < p / 2 ? 1 : 0;
  }
  function zOpen(angle) {
    var u = ((angle % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
    return (u < pitch() / 2) ? 1 : 0;
  }
  // The wheel turns anticlockwise as th grows: the track point psi sits at math angle psi + th.
  // A detector fixed at math angle a therefore sees track angle a - th.
  function detectors(angle) {
    return { A: open(-angle), B: open(offB() - angle), Z: zOpen(-angle) };
  }
  function countsPerTurn() { return P.mode * P.N; }
  function resolution() { return 360 / countsPerTurn(); }

  // one simulation step: move, read detectors, update the count on edges
  function step(dt) { advance(P.w * D * dt); }
  function advance(dth) {
    th += dth;
    var d = detectors(th);
    if (d.A !== A || d.B !== B) {                          // the detectors changed
      if (dropPending > 0) { dropPending--; }               // the decoder misses this edge and keeps its old state
      else {
        var chA = d.A !== sA, chB = d.B !== sB, from = "" + sA + sB, to = "" + d.A + d.B;
        if (chA && chB) { missed++; evt = 2; trans = { from: from, to: to, dir: 0, t: performance.now() }; }
        else if (chA || chB) {
          var dir = chA ? (d.A !== d.B ? 1 : -1) : (d.A === d.B ? 1 : -1);   // which bit changed, and the other bit's value
          count += dir; evt = dir; trans = { from: from, to: to, dir: dir, t: performance.now() };
        }
        sA = d.A; sB = d.B;
      }
    }
    if (P.zres && d.Z === 1 && Z === 0) count = 0;
    A = d.A; B = d.B; Z = d.Z;
  }
  function countedAngle() { return count * resolution(); }

  function fmt(v, n) { if (Math.abs(v) < 5e-4) v = 0; return v.toFixed(n === undefined ? 1 : n); }
  function wrapDeg(a) { return ((a + 180) % 360 + 360) % 360 - 180; }

  // ---- drawing helpers -------------------------------------------------
  function text(s, x, y, color, size, align, italic) {
    ctx.save(); ctx.fillStyle = color;
    ctx.font = (italic ? "italic " : "") + (size || 12) + 'px "Linux Libertine O", Georgia, serif';
    ctx.textAlign = align || "left"; ctx.textBaseline = "middle"; ctx.fillText(s, x, y); ctx.restore();
  }
  function arrow(x0, y0, x1, y1, color, width) {
    var L = Math.hypot(x1 - x0, y1 - y0); if (L < 2) return;
    ctx.save(); ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = width; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    var ang = Math.atan2(y1 - y0, x1 - x0), h = Math.min(9, L), w = 0.42;
    ctx.beginPath(); ctx.moveTo(x1, y1);
    ctx.lineTo(x1 - h * Math.cos(ang - w), y1 - h * Math.sin(ang - w));
    ctx.lineTo(x1 - h * Math.cos(ang + w), y1 - h * Math.sin(ang + w));
    ctx.closePath(); ctx.fill(); ctx.restore();
  }
  // a ring sector path from canvas angle a0 to a1 (anticlockwise positive, so canvas angles are negated)
  function sector(cx, cy, r0, r1, a0, a1) {
    ctx.beginPath();
    ctx.arc(cx, cy, r1, -a0, -a1, true);
    ctx.arc(cx, cy, r0, -a1, -a0, false);
    ctx.closePath();
  }

  function drawWheel(cx, cy, R) {
    var p = pitch();
    var Rs = R * 0.84, sw = R * 0.12;        // slot track radius and radial half-length
    var Rz = R * 0.55, zw = R * 0.08;        // index track
    // the disc
    ctx.save();
    ctx.fillStyle = COL.disc; ctx.beginPath(); ctx.arc(cx, cy, R, 0, 2 * Math.PI); ctx.fill();
    // slots: track angle psi in [k p, k p + p/2) is open; the track point psi sits at canvas angle psi - th
    ctx.fillStyle = COL.slot;
    for (var i = 0; i < P.N; i++) { sector(cx, cy, Rs - sw, Rs + sw, i * p + th, i * p + p / 2 + th); ctx.fill(); }
    // the index window, track angle 0 to p/2
    sector(cx, cy, Rz - zw, Rz + zw, th, p / 2 + th); ctx.fill();
    // hub
    ctx.fillStyle = COL.hub; ctx.beginPath(); ctx.arc(cx, cy, R * 0.25, 0, 2 * Math.PI); ctx.fill();
    ctx.strokeStyle = COL.edge; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = COL.edge; ctx.beginPath(); ctx.arc(cx, cy, 2.5, 0, 2 * Math.PI); ctx.fill();
    ctx.restore();

    // an LED and detector pair fixed to the housing at canvas angle a on track radius r.
    // The detector is under the disc: draw it clipped to the open parts of the track,
    // so it shows only through a slot. The LED is above the disc: draw it on top.
    function pair(a, r, rd, rl, on, isZ) {
      var x = cx + r * Math.cos(-a), y = cy + r * Math.sin(-a);
      var dcol = on ? COL.det : COL.off, lcol = on ? COL.led : COL.off;
      ctx.save();
      // clip to the open windows near this detector
      ctx.beginPath();
      if (isZ) {
        ctx.arc(cx, cy, Rz + zw, -th, -(p / 2 + th), true); ctx.arc(cx, cy, Rz - zw, -(p / 2 + th), -th, false); ctx.closePath();
      } else {
        var psi = a - th, k = Math.floor(psi / p);
        for (var j = k - 1; j <= k + 1; j++) {
          var a0 = j * p + th, a1 = j * p + p / 2 + th;
          ctx.moveTo(cx + (Rs + sw) * Math.cos(-a0), cy + (Rs + sw) * Math.sin(-a0));
          ctx.arc(cx, cy, Rs + sw, -a0, -a1, true);
          ctx.arc(cx, cy, Rs - sw, -a1, -a0, false);
          ctx.closePath();
        }
      }
      ctx.clip();
      ctx.fillStyle = dcol; ctx.beginPath(); ctx.arc(x, y, rd, 0, 2 * Math.PI); ctx.fill();
      ctx.restore();
      ctx.fillStyle = lcol; ctx.beginPath(); ctx.arc(x, y, rl, 0, 2 * Math.PI); ctx.fill();
      return { x: x, y: y };
    }
    var quad = P.mode === 4;
    var slotW = 2 * Rs * Math.sin(p / 4);                 // width of a slot at the track
    var rd = Math.min(R * 0.085, 0.45 * slotW), rl = 0.58 * rd;
    var zW = 2 * Rz * Math.sin(p / 4);
    var rdz = Math.min(R * 0.07, 0.45 * zW), rlz = 0.58 * rdz;
    var pA = pair(0, Rs, rd, rl, true, false);
    var pB = pair(offB(), Rs, rd, rl, quad, false);
    var pZ = pair(0, Rz, rdz, rlz, true, true);
    // labels, placed as in the figure
    ctx.save(); ctx.strokeStyle = COL.det; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(pA.x + R * 0.1, pA.y + R * 0.02); ctx.lineTo(pA.x + R * 0.3, pA.y + R * 0.17); ctx.stroke();
    text("A", pA.x + R * 0.33, pA.y + R * 0.2, COL.det, 13, "left");
    ctx.strokeStyle = quad ? COL.det : COL.off;
    ctx.beginPath(); ctx.moveTo(pB.x + R * 0.08, pB.y - R * 0.06); ctx.lineTo(pB.x + R * 0.2, pB.y - R * 0.3); ctx.stroke();
    text("B", pB.x + R * 0.22, pB.y - R * 0.36, quad ? COL.det : COL.off, 13, "left");
    ctx.strokeStyle = COL.det;
    ctx.beginPath(); ctx.moveTo(pZ.x + R * 0.05, pZ.y + R * 0.06); ctx.lineTo(pZ.x + R * 0.25, pZ.y + R * 0.55); ctx.stroke();
    text("Z", pZ.x + R * 0.27, pZ.y + R * 0.62, COL.det, 13, "left");
    ctx.restore();

    // true angle arrow from the hub and the counted angle arrow, each on a white halo so they show on the disc
    var L = R * 0.5, q = countedAngle() * D;
    arrow(cx, cy, cx + L * Math.cos(-th), cy + L * Math.sin(-th), COL.tru, 2.4);
    arrow(cx, cy, cx + L * Math.cos(-q), cy + L * Math.sin(-q), COL.est, 1.8);
    text("Positive turn: anticlockwise", cx, cy + R + 16, COL.text, 11, "center");
  }

  // ---- the state diagram ---------------------------------------------------
  // 00 top left, 10 top right, 11 bottom right, 01 bottom left: forward runs clockwise, +1 a step.
  var SPOS = { "00": [-1, -1], "10": [1, -1], "11": [1, 1], "01": [-1, 1] };
  var FWD = { "00": "10", "10": "11", "11": "01", "01": "00" };
  function drawStates(cx, cy, s) {
    var r = s * 0.2, now = performance.now();
    function pos(k) { return [cx + s * SPOS[k][0], cy + s * SPOS[k][1]]; }
    // a curved arrow from state a to state b, bowed out (sign +1) or in (sign -1)
    function curve(a, b, color, width, bow) {
      var p = pos(a), q = pos(b), mx = (p[0] + q[0]) / 2, my = (p[1] + q[1]) / 2;
      var nx = -(q[1] - p[1]), ny = q[0] - p[0], L = Math.hypot(nx, ny); nx /= L; ny /= L;
      var ox = mx - cx, oy = my - cy; if (nx * ox + ny * oy < 0) { nx = -nx; ny = -ny; }   // normal pointing away from the centre
      var cxp = mx + bow * nx * s * 0.42, cyp = my + bow * ny * s * 0.42;
      // trim the ends to the state circles
      function trim(P0, C, d) { var vx = C[0] - P0[0], vy = C[1] - P0[1], l = Math.hypot(vx, vy); return [P0[0] + vx / l * d, P0[1] + vy / l * d]; }
      var p1 = trim(p, [cxp, cyp], r + 4), q1 = trim(q, [cxp, cyp], r + 7);
      ctx.save(); ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = width;
      ctx.beginPath(); ctx.moveTo(p1[0], p1[1]); ctx.quadraticCurveTo(cxp, cyp, q1[0], q1[1]); ctx.stroke();
      var ang = Math.atan2(q1[1] - cyp, q1[0] - cxp), hl = 6 + width * 1.5;
      ctx.beginPath(); ctx.moveTo(q1[0] + 3 * Math.cos(ang), q1[1] + 3 * Math.sin(ang));
      ctx.lineTo(q1[0] - hl * Math.cos(ang - 0.42), q1[1] - hl * Math.sin(ang - 0.42));
      ctx.lineTo(q1[0] - hl * Math.cos(ang + 0.42), q1[1] - hl * Math.sin(ang + 0.42)); ctx.closePath(); ctx.fill();
      ctx.restore();
      return [(mx + cxp) / 2, (my + cyp) / 2];          // the curve's midpoint, for its label
    }
    // the static diagram, faint
    ctx.save(); ctx.strokeStyle = COL.grid; ctx.setLineDash([4, 4]); ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(pos("00")[0], pos("00")[1]); ctx.lineTo(pos("11")[0], pos("11")[1]); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(pos("10")[0], pos("10")[1]); ctx.lineTo(pos("01")[0], pos("01")[1]); ctx.stroke();
    ctx.restore();
    Object.keys(FWD).forEach(function (k) {
      var m1 = curve(k, FWD[k], "rgba(43,108,176,0.35)", 1.2, 1);
      var m2 = curve(FWD[k], k, "rgba(221,107,32,0.35)", 1.2, -1);
      var ox = m1[0] - cx, oy = m1[1] - cy, L = Math.hypot(ox, oy);
      text("+1", m1[0] + ox / L * 11, m1[1] + oy / L * 11, "rgba(43,108,176,0.8)", 11, "center");
      text("−1", m2[0] - ox / L * 11, m2[1] - oy / L * 11, "rgba(221,107,32,0.8)", 11, "center");
    });
    text("Both bits changed:", cx, cy - 7, COL.text, 10.5, "center"); text("edge missed", cx, cy + 7, COL.text, 10.5, "center");
    // the last transition, bright, fading over a second
    if (trans) {
      var age = (now - trans.t) / 1000, a = Math.max(0, 1 - age / 1.2);
      if (a > 0) {
        if (trans.dir === 0) {
          var p = pos(trans.from), q = pos(trans.to);
          ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = COL.est; ctx.lineWidth = 3; ctx.setLineDash([6, 4]);
          ctx.beginPath(); ctx.moveTo(p[0], p[1]); ctx.lineTo(q[0], q[1]); ctx.stroke(); ctx.restore();
        } else {
          ctx.save(); ctx.globalAlpha = a;
          if (trans.dir > 0) curve(trans.from, trans.to, COL.det, 3.2, 1); else curve(trans.from, trans.to, "#DD6B20", 3.2, -1);
          ctx.restore();
        }
      }
    }
    // the states: the decoder's state filled, the detectors' state ringed when the two differ after a miss
    var dec = "" + sA + sB, det = "" + A + B;
    Object.keys(SPOS).forEach(function (k) {
      var p = pos(k), on = k === dec;
      ctx.fillStyle = on ? COL.det : "#FFFFFF"; ctx.strokeStyle = on ? COL.det : COL.disc; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(p[0], p[1], r, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();
      if (k === det && det !== dec) { ctx.strokeStyle = COL.est; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(p[0], p[1], r + 4, 0, 2 * Math.PI); ctx.stroke(); }
      text(k, p[0], p[1] + 1, on ? "#FFFFFF" : COL.disc, 15, "center");
    });
    text("A B", pos("00")[0] - r - 10, pos("00")[1] - r - 6, COL.text, 11, "right");
    text("Filled: the state the decoder holds" + (det !== dec ? ". Red ring: what the detectors now read" : ""), cx, cy + s + r + 30, COL.text, 11, "center");
  }

  // ---- A and B against time, with each decoder step marked -------------------------
  function drawTraces(x0, y0, w, h) {
    var rows = [["A", trA], ["B", trB]], rh = (h - 30) / 2;
    ctx.save();
    for (var r = 0; r < 2; r++) {
      var yb = y0 + (r + 1) * rh - rh * 0.2, yt = y0 + r * rh + rh * 0.25;
      ctx.strokeStyle = COL.grid; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x0, yb); ctx.lineTo(x0 + w, yb); ctx.stroke();
      text(rows[r][0], x0 - 10, (yb + yt) / 2, COL.det, 13, "right");
      ctx.strokeStyle = COL.det; ctx.lineWidth = 1.4; ctx.beginPath();
      var buf = rows[r][1];
      for (var i = 0; i < trN; i++) { var k = (trI + i) % trN, x = x0 + w * i / (trN - 1), y = buf[k] ? yt : yb; if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); }
      ctx.stroke();
    }
    // the decoder's steps on a strip below: +1 blue, -1 orange, a missed edge red
    var ys = y0 + h - 12;
    text("Step", x0 - 10, ys, COL.text, 11, "right");
    for (var i = 0; i < trN; i++) {
      var k = (trI + i) % trN, e = trS[k]; if (!e) continue;
      var x = x0 + w * i / (trN - 1);
      if (e === 2) { text("✕", x, ys, COL.est, 12, "center"); }
      else { ctx.strokeStyle = e > 0 ? COL.det : "#DD6B20"; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(x, ys - 6); ctx.lineTo(x, ys + 6); ctx.stroke(); }
    }
    text(drive === "hand" ? "Time advances only while the wheel moves" : "Last " + WIN + " s", x0 + w, y0 - 8, COL.text, 11, "right");
    text("Blue tick: +1. Orange tick: −1. Red cross: missed edge", x0, y0 - 8, COL.text, 11, "left");
    ctx.restore();
  }

  // ---- draw -----------------------------------------------------------
  function draw() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);
    var panel = document.getElementById("panel"), panelW = panel.offsetWidth + 16;
    var RH = Math.max(110, Math.min(150, H * 0.27)), rowTop = H - 16 - RH;
    var ax0 = panelW, ax1 = W - 10, ay0 = 10, ay1 = rowTop - 24;
    var R = Math.min((ay1 - ay0) * 0.42, (ax1 - ax0) * 0.2);
    var cx = ax0 + (ax1 - ax0) * 0.26, cy = (ay0 + ay1) / 2 - 6;
    drawWheel(cx, cy, R); wheel = { cx: cx, cy: cy, R: R };
    // the two angles and whether they agree: within one count (a quarter pitch) is normal, because the
    // count changes only at an edge; more than that means edges were missed
    var diff = countedAngle() - th / D, stepD = resolution(), lost = Math.ceil(Math.abs(diff) / stepD - 1e-9) - 1;
    text("Wheel " + fmt(wrapDeg(th / D)) + "°    Encoder " + fmt(wrapDeg(countedAngle())) + "°", cx, cy + R + 34, COL.disc, 13, "center");
    if (lost <= 0) text("No error: within one count", cx, cy + R + 52, COL.det, 13, "center");
    else text(lost + (lost === 1 ? " edge" : " edges") + " may have been missed", cx, cy + R + 52, COL.est, 13, "center");
    var s = Math.min((ay1 - ay0) * 0.27, (ax1 - ax0) * 0.12);
    drawStates(ax0 + (ax1 - ax0) * 0.72, cy - 8, s);
    var bx0 = Math.max(panelW, 48) + 10;
    drawTraces(bx0, rowTop + 16, W - bx0 - 14, RH - 8);

    document.getElementById("tth").textContent = fmt(wrapDeg(th / D));
    document.getElementById("tc").textContent = count;
    document.getElementById("tres").textContent = fmt(resolution(), 2);
    document.getElementById("tq").textContent = fmt(wrapDeg(countedAngle()));
    document.getElementById("terr").textContent = fmt(countedAngle() - th / D);
    document.getElementById("tmiss").textContent = missed;
  }

  function record(h) {
    trAcc += h;
    if (trAcc >= 1 / TR) {
      trAcc -= 1 / TR;
      trA[trI] = A; trB[trI] = B; trZ[trI] = Z; trT[trI] = th / D; trQ[trI] = countedAngle(); trS[trI] = evt; evt = 0;
      trE[trI] = wrapDeg(countedAngle() - th / D);
      trI = (trI + 1) % trN;
    }
  }
  function tick(now) {
    var dt = Math.min(0.1, (now - last) / 1000); last = now;
    var h = 1 / FSIM;
    if (drive === "motor") {
      acc += dt;
      while (acc >= h) { step(h); acc -= h; record(h); }
    } else {
      // by hand: move to the target in small angle steps, so no edge is skipped however fast the drag;
      // the time axis advances only over this frame, and only if the wheel moved
      var dth = thT - th;
      if (Math.abs(dth) > 1e-6) {
        var maxStep = (2 * Math.PI / P.N) / 40, n = Math.max(Math.ceil(Math.abs(dth) / maxStep), Math.round(dt * FSIM), 1);
        var th0 = th;
        for (var i = 1; i <= n; i++) { advance(th0 + dth * i / n - th); record(dt / n); }   // lands exactly on the target
      }
      acc = 0;
    }
    draw();
    requestAnimationFrame(tick);
  }

  // ---- controls ---------------------------------------------------------
  function reset() { count = 0; missed = 0; th = 0; thT = 0; setPosSlider(0); var d0 = detectors(0); A = d0.A; B = d0.B; Z = d0.Z; sA = A; sB = B; trans = null; }
  function setPosSlider(a) {
    var el = document.getElementById("sp"), v = Math.max(-720, Math.min(720, a / D));
    el.value = v; document.getElementById("vp").textContent = fmt(a / D) + " °";
  }
  function setDrive(dv) {
    drive = dv;
    var hand = dv === "hand";
    if (hand) { th = Math.atan2(Math.sin(th), Math.cos(th)); thT = th; setPosSlider(th); }
    document.getElementById("sp").disabled = !hand;
    document.getElementById("sw").disabled = hand;
    document.getElementById("stop").disabled = hand; document.getElementById("rev").disabled = hand;
  }
  var SPEC = { N: ["sN", "vN", function (v) { return v; }],
               w: ["sw", "vw", function (v) { return v + " °/s"; }] };
  function show(key) { document.getElementById(SPEC[key][1]).textContent = SPEC[key][2](P[key]); }
  Object.keys(SPEC).forEach(function (key) {
    var el = document.getElementById(SPEC[key][0]);
    el.addEventListener("input", function () {
      P[key] = parseFloat(el.value); show(key);
      if (key === "N") reset();
    });
    show(key);
  });
  Array.prototype.forEach.call(document.querySelectorAll('input[name="mode"]'), function (el) {
    el.addEventListener("change", function () { P.mode = parseInt(el.value, 10); reset(); });
  });
  document.getElementById("cz").addEventListener("change", function (e) { P.zres = e.target.checked; });
  Array.prototype.forEach.call(document.querySelectorAll('input[name="drive"]'), function (el) {
    el.addEventListener("change", function () { setDrive(el.value); });
  });
  document.getElementById("sp").addEventListener("input", function (e) {
    thT = parseFloat(e.target.value) * D; document.getElementById("vp").textContent = fmt(thT / D) + " °";
  });
  function pointerAngle(e) {
    var r = stage.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    return { a: Math.atan2(-(y - wheel.cy), x - wheel.cx), d: Math.hypot(x - wheel.cx, y - wheel.cy) };
  }
  stage.addEventListener("pointerdown", function (e) {
    if (drive !== "hand" || e.target.closest("#panel")) return;
    var p = pointerAngle(e); if (p.d > wheel.R * 1.05) return;
    grab = { a: p.a }; stage.classList.add("grabbing"); stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener("pointermove", function (e) {
    var p = pointerAngle(e);
    if (!grab) {
      stage.classList.toggle("grab", drive === "hand" && !e.target.closest("#panel") && p.d <= wheel.R * 1.05);
      return;
    }
    var da = Math.atan2(Math.sin(p.a - grab.a), Math.cos(p.a - grab.a));   // the turn since the last move, the short way
    grab.a = p.a; thT += da; setPosSlider(thT);
  });
  function release(e) {
    if (!grab) return; grab = null; stage.classList.remove("grabbing");
    try { stage.releasePointerCapture(e.pointerId); } catch (err) {}
  }
  stage.addEventListener("pointerup", release); stage.addEventListener("pointercancel", release);
  document.getElementById("stop").addEventListener("click", function () { P.w = 0; document.getElementById("sw").value = 0; show("w"); });
  document.getElementById("rev").addEventListener("click", function () { P.w = -P.w; document.getElementById("sw").value = P.w; show("w"); });
  document.getElementById("drop").addEventListener("click", function () { dropPending++; });
  document.getElementById("zero").addEventListener("click", reset);

  // URL presets: ?N=16&w=45&mode=4&z=0
  (function () {
    var q = new URLSearchParams(location.search);
    Object.keys(SPEC).forEach(function (key) {
      if (!q.has(key)) return;
      var v = parseFloat(q.get(key)); if (!isFinite(v)) return;
      var el = document.getElementById(SPEC[key][0]);
      v = Math.max(parseFloat(el.min), Math.min(parseFloat(el.max), v));
      P[key] = v; el.value = v; show(key);
    });
    if (q.get("drive") === "hand") { document.querySelector('input[name="drive"][value="hand"]').checked = true; setTimeout(function () { setDrive("hand"); }, 0); }
    if (q.has("z")) { P.zres = q.get("z") === "1"; document.getElementById("cz").checked = P.zres; }
  })();

  // ---- sizing ---------------------------------------------------------
  var W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = window.devicePixelRatio || 1;
    W = stage.clientWidth; H = stage.clientHeight;
    canvas.width  = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    draw();
  }
  window.addEventListener("resize", resize);
  reset();
  resize();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
