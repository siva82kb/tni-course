<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="https://cdn.plot.ly/plotly-2.32.0.min.js" charset="utf-8"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #ffffff;
    color: #2D3748;
    padding: 0.5rem 1rem 0.3rem;
    height: 100vh;
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
  }
  #controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1.2rem;
    font-size: 0.72rem;
    flex-wrap: wrap;
  }
  .ctrl { display: flex; align-items: center; gap: 0.3rem; }
  .ctrl label { color: #718096; font-weight: 600; white-space: nowrap; }
  input[type="range"] { width: 80px; cursor: pointer; }
  #mu-slider    { accent-color: #718096; }
  #sigma-slider { accent-color: #744210; }
  #k-slider     { accent-color: #2B6CB0; }
  .val { font-weight: 700; min-width: 2rem; }
  .val-mu    { color: #718096; }
  .val-sigma { color: #744210; }
  .val-k     { color: #2B6CB0; }
  #plot { flex: 1; min-height: 0; }
  .readout {
    display: flex; gap: 1rem;
    font-size: 0.78rem;
    justify-content: center;
    align-items: baseline;
    padding-bottom: 0.1rem;
    flex-wrap: wrap;
  }
  .readout span { color: #718096; }
  .r-eq   { color: #4A5568; }
  .r-area { color: #2B6CB0 !important; font-size: 1.05rem; font-weight: 700; }
</style>
</head>
<body>

<div id="controls">
  <div class="ctrl">
    <label>True &mu;</label>
    <input type="range" id="mu-slider" min="-2" max="2" step="0.1" value="0">
    <span id="mu-val" class="val val-mu">0.0</span>
  </div>
  <div class="ctrl">
    <label>True &sigma;</label>
    <input type="range" id="sigma-slider" min="0.2" max="2.0" step="0.1" value="1.0">
    <span id="sigma-val" class="val val-sigma">1.0</span>
  </div>
  <div class="ctrl">
    <label>k</label>
    <input type="range" id="k-slider" min="0" max="5" step="0.05" value="1">
    <span id="k-val" class="val val-k">1.00</span>
    <input type="number" id="k-input" min="0" max="5" step="0.05" value="1.00"
           style="width:4rem; font-size:0.72rem; font-weight:700; color:#2B6CB0;
                  border:1px solid #CBD5E0; border-radius:3px; padding:0.1rem 0.25rem;
                  text-align:center;">
  </div>
</div>

<div id="plot"></div>

<div class="readout">
  <span class="r-eq">P(&mu; &minus; <span class="k-eq">1.00</span>&sdot;&sigma; &le; X &le; &mu; + <span class="k-eq">1.00</span>&sdot;&sigma;) &nbsp;=&nbsp;</span>
  <strong class="r-area" id="area-val">68.27%</strong>
</div>

<script>
const N_PDF  = 500;
const N_FILL = 300;

function gaussPDF(x, mu, sigma) {
  return (1 / (sigma * Math.sqrt(2 * Math.PI))) *
         Math.exp(-0.5 * ((x - mu) / sigma) ** 2);
}
function linspace(a, b, n) {
  return Array.from({length: n}, (_, i) => a + (b - a) * i / (n - 1));
}
// Abramowitz & Stegun 7.1.26 — max |error| < 1.5e-7
function erf(x) {
  const s = x < 0 ? -1 : 1;
  const t = 1 / (1 + 0.3275911 * Math.abs(x));
  const p = t * (0.254829592 + t * (-0.284496736 + t * (1.421413741 +
              t * (-1.453152027 + t * 1.061405429))));
  return s * (1 - p * Math.exp(-x * x));
}
function areaUnderGauss(k) {
  return erf(k / Math.sqrt(2));
}

const cfg = { displayModeBar: false, responsive: true };

// k is owned here — never read back from the slider (step snapping would corrupt typed values)
let currentK = 1.0;

function update() {
  const mu    = parseFloat(document.getElementById('mu-slider').value);
  const sigma = parseFloat(document.getElementById('sigma-slider').value);
  const k     = currentK;

  document.getElementById('mu-val').textContent    = mu.toFixed(1);
  document.getElementById('sigma-val').textContent = sigma.toFixed(1);
  document.getElementById('k-val').textContent     = k.toFixed(2);
  document.querySelectorAll('.k-eq').forEach(el => el.textContent = k.toFixed(2));

  const area = areaUnderGauss(k);
  document.getElementById('area-val').textContent = (area * 100).toFixed(2) + '%';

  const xLo  = mu - 5 * sigma;
  const xHi  = mu + 5 * sigma;
  const xPDF = linspace(xLo, xHi, N_PDF);
  const yPDF = xPDF.map(x => gaussPDF(x, mu, sigma));
  const yPeak = gaussPDF(mu, mu, sigma);

  const xL = mu - k * sigma;
  const xR = mu + k * sigma;

  // Fill only within ±kσ — clamp to plot range
  const xFill = linspace(Math.max(xL, xLo), Math.min(xR, xHi), N_FILL);
  const yFill = xFill.map(x => gaussPDF(x, mu, sigma));

  const traces = [
    // Shaded fill
    {
      x: xFill, y: yFill,
      type: 'scatter', mode: 'none',
      fill: 'tozeroy',
      fillcolor: 'rgba(43,108,176,0.18)',
      showlegend: false,
      hoverinfo: 'skip',
    },
    // Full PDF
    {
      x: xPDF, y: yPDF,
      type: 'scatter', mode: 'lines',
      line: { color: '#A51C30', width: 2 },
      name: 'N(μ, σ)',
      hovertemplate: 'x = %{x:.2f},  f(x) = %{y:.4f}<extra></extra>',
    },
  ];

  // Vertical boundary lines as shapes
  const shapes = k > 0 ? [
    {
      type: 'line', xref: 'x', yref: 'paper',
      x0: xL, x1: xL, y0: 0, y1: 1,
      line: { color: '#2B6CB0', width: 1.2, dash: 'dash' },
    },
    {
      type: 'line', xref: 'x', yref: 'paper',
      x0: xR, x1: xR, y0: 0, y1: 1,
      line: { color: '#2B6CB0', width: 1.2, dash: 'dash' },
    },
  ] : [];

  // Area annotation centred in the shaded region
  const annotations = k > 0.15 ? [
    {
      x: mu, y: yPeak * 0.30,
      xref: 'x', yref: 'y',
      text: `<b>${(area * 100).toFixed(2)}%</b>`,
      showarrow: false,
      font: { size: 15, color: '#1a365d' },
      bgcolor: 'rgba(255,255,255,0.75)',
      borderpad: 3,
    },
  ] : [];

  const layout = {
    margin: { l: 60, r: 20, t: 10, b: 50 },
    xaxis: {
      range: [xLo, xHi],
      title: { text: 'Value', font: { size: 13, color: '#4A5568' } },
      showgrid: false, linecolor: '#CBD5E0', zerolinecolor: '#CBD5E0',
      tickfont: { color: '#4A5568', size: 11 },
    },
    yaxis: {
      range: [0, yPeak * 1.35],
      title: { text: 'Probability density', font: { size: 11, color: '#4A5568' } },
      showgrid: false, linecolor: '#CBD5E0', zeroline: false,
      tickfont: { color: '#718096', size: 11 },
    },
    plot_bgcolor: '#ffffff', paper_bgcolor: '#ffffff',
    showlegend: true,
    legend: {
      orientation: 'h', x: 0.5, xanchor: 'center', y: 1.08,
      bgcolor: 'rgba(255,255,255,0.85)', font: { size: 10, color: '#4A5568' },
    },
    shapes,
    annotations,
    hovermode: 'closest',
    font: { family: 'Segoe UI, system-ui, sans-serif' },
  };

  Plotly.react('plot', traces, layout, cfg);
}

update();
document.getElementById('mu-slider').addEventListener('input', update);
document.getElementById('sigma-slider').addEventListener('input', update);
document.getElementById('k-slider').addEventListener('input', () => {
  currentK = parseFloat(document.getElementById('k-slider').value);
  document.getElementById('k-input').value = currentK.toFixed(2);
  update();
});
document.getElementById('k-input').addEventListener('input', () => {
  const v = parseFloat(document.getElementById('k-input').value);
  if (isNaN(v)) return;
  currentK = Math.max(0, Math.min(5, v));
  document.getElementById('k-slider').value = currentK; // snaps visually; we ignore the snap
  update();
});
document.getElementById('k-input').addEventListener('change', () => {
  let v = parseFloat(document.getElementById('k-input').value);
  if (isNaN(v)) v = 0;
  currentK = Math.max(0, Math.min(5, v));
  document.getElementById('k-input').value = currentK.toFixed(2);
  document.getElementById('k-slider').value = currentK;
  update();
});
</script>
</body>
</html>
