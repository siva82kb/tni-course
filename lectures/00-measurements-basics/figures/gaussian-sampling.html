<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="https://cdn.plot.ly/plotly-2.32.0.min.js" charset="utf-8"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #ffffff;
    color: #2D3748;
    padding: 0.6rem 1rem 0.4rem;
    height: 100vh;
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }
  #controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    font-size: 0.72rem;
    flex-wrap: wrap;
  }
  .ctrl { display: flex; align-items: center; gap: 0.3rem; }
  .ctrl label { color: #718096; font-weight: 600; white-space: nowrap; }
  input[type="range"] { width: 70px; cursor: pointer; }
  #n-slider     { accent-color: #2B6CB0; }
  #bin-slider   { accent-color: #276749; }
  #mu-slider    { accent-color: #718096; }
  #sigma-slider { accent-color: #744210; }
  .val { font-weight: 700; min-width: 1.8rem; }
  .val-n     { color: #2B6CB0; }
  .val-bin   { color: #276749; }
  .val-mu    { color: #718096; }
  .val-sigma { color: #744210; }
  .unit { color: #A0AEC0; font-size: 0.68rem; }
  button {
    padding: 0.15rem 0.6rem;
    border: none; border-radius: 4px;
    font-size: 0.72rem; font-weight: 600;
    cursor: pointer; white-space: nowrap;
  }
  #resample-btn { background: #2B6CB0; color: #fff; }
  #resample-btn:hover { background: #2c5282; }
  #plot { flex: 1; min-height: 0; }
  .readout {
    display: flex; gap: 1.5rem; font-size: 0.72rem;
    justify-content: center; padding-bottom: 0.1rem;
    flex-wrap: wrap;
  }
  .readout span { color: #718096; }
  .r-true { color: #A51C30 !important; font-weight: 700; }
  .r-est  { color: #1A202C !important; font-weight: 700; }
</style>
</head>
<body>

<div id="controls">
  <div class="ctrl">
    <label>N samples</label>
    <input type="range" id="n-slider" min="1" max="500" step="1" value="20">
    <span id="n-val" class="val val-n">20</span>
  </div>
  <div class="ctrl">
    <label>Bin width</label>
    <input type="range" id="bin-slider" min="0.1" max="1.0" step="0.1" value="0.3">
    <span id="bin-val" class="val val-bin">0.3</span>
  </div>
  <div class="ctrl">
    <button id="resample-btn">Resample</button>
  </div>
  <div class="ctrl">
    <label>True &mu;</label>
    <input type="range" id="mu-slider" min="-2" max="2" step="0.1" value="0">
    <span id="mu-val" class="val val-mu">0.0</span>
  </div>
  <div class="ctrl">
    <label>True &sigma;</label>
    <input type="range" id="sigma-slider" min="0.2" max="2.0" step="0.1" value="1.0">
    <span id="sigma-val" class="val val-sigma">1.0</span>
  </div>
</div>

<div id="plot"></div>

<div class="readout">
  <div><span>True: </span><strong class="r-true" id="true-readout">&#956; = 0.00, &#963; = 1.00</strong></div>
  <div><span>Estimated: </span><strong class="r-est" id="est-readout">&#956;&#770; = &mdash;, &#963;&#770; = &mdash;</strong></div>
</div>

<script>
const X_MIN = -5, X_MAX = 5;
const MAX_N = 500;
const N_PDF = 300;

function seededRand(seed) {
  let s = seed;
  return () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
}
function gaussNoise(rng) {
  const u1 = Math.max(rng(), 1e-10), u2 = rng();
  return Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
}
function gaussPDF(x, mu, sigma) {
  return (1 / (sigma * Math.sqrt(2 * Math.PI))) *
         Math.exp(-0.5 * ((x - mu) / sigma) ** 2);
}
function linspace(a, b, n) {
  return Array.from({length: n}, (_, i) => a + (b - a) * i / (n - 1));
}

let sampleSeed = 42;
let noisePool  = resample();

function resample() {
  const rng = seededRand(sampleSeed);
  return Array.from({length: MAX_N}, () => gaussNoise(rng));
}

const cfg = { displayModeBar: false, responsive: true };
const TICK_SIZE = 12;
const xPDF = linspace(X_MIN, X_MAX, N_PDF);

function update() {
  const N       = parseInt(document.getElementById('n-slider').value);
  const binSize = parseFloat(document.getElementById('bin-slider').value);
  const mu      = parseFloat(document.getElementById('mu-slider').value);
  const sigma   = parseFloat(document.getElementById('sigma-slider').value);

  document.getElementById('n-val').textContent    = N;
  document.getElementById('bin-val').textContent  = binSize.toFixed(1);
  document.getElementById('mu-val').textContent   = mu.toFixed(1);
  document.getElementById('sigma-val').textContent = sigma.toFixed(1);

  const xs = noisePool.slice(0, N).map(z => mu + sigma * z);

  const muHat    = xs.reduce((a, b) => a + b, 0) / N;
  const sigmaHat = Math.sqrt(xs.reduce((s, x) => s + (x - muHat) ** 2, 0) / N);

  document.getElementById('true-readout').textContent =
    `μ = ${mu.toFixed(2)}, σ = ${sigma.toFixed(2)}`;
  document.getElementById('est-readout').textContent =
    `μ̂ = ${muHat.toFixed(2)}, σ̂ = ${sigmaHat.toFixed(2)}`;

  const truePDF = xPDF.map(x => gaussPDF(x, mu, sigma));
  const estPDF  = xPDF.map(x => gaussPDF(x, muHat, sigmaHat));
  const yPeak   = Math.max(...truePDF) * 1.3;
  const yFloor  = -yPeak * 0.06;

  const traces = [
    // ── Sample scatter on x-axis ────────────────────────────
    {
      x: xs, y: Array(N).fill(yFloor * 0.5),
      type: 'scatter', mode: 'markers',
      marker: { color: 'rgba(43,108,176,0.6)', size: 5, symbol: 'circle',
                line: { color: '#1a4a7a', width: 0.8 } },
      name: 'Samples',
      hovertemplate: '%{x:.2f}<extra></extra>',
    },
    // ── Histogram (density) ─────────────────────────────────
    {
      x: xs,
      type: 'histogram',
      xbins: { start: X_MIN, end: X_MAX, size: binSize },
      histnorm: 'probability density',
      marker: { color: 'rgba(43,108,176,0.35)', line: { color: '#2B6CB0', width: 0.6 } },
      name: 'Sample histogram',
      hovertemplate: '%{x:.2f}  density=%{y:.3f}<extra></extra>',
    },
    // ── True PDF ────────────────────────────────────────────
    {
      x: xPDF, y: truePDF,
      type: 'scatter', mode: 'lines',
      line: { color: '#A51C30', width: 2, dash: 'dot' },
      name: 'True distribution',
    },
    // ── Estimated PDF ───────────────────────────────────────
    {
      x: xPDF, y: estPDF,
      type: 'scatter', mode: 'lines',
      line: { color: '#1A202C', width: 2 },
      name: 'Estimated distribution',
    },
    // ── True mean line ──────────────────────────────────────
    {
      x: [mu, mu], y: [0, gaussPDF(mu, mu, sigma) * 1.08],
      type: 'scatter', mode: 'lines',
      line: { color: '#A51C30', width: 1, dash: 'dot' },
      showlegend: false, hoverinfo: 'skip',
    },
    // ── Estimated mean line ─────────────────────────────────
    {
      x: [muHat, muHat], y: [0, gaussPDF(muHat, muHat, sigmaHat) * 1.08],
      type: 'scatter', mode: 'lines',
      line: { color: '#1A202C', width: 1 },
      showlegend: false, hoverinfo: 'skip',
    },
  ];

  const layout = {
    margin: { l: 55, r: 20, t: 10, b: 50 },
    xaxis: {
      range: [X_MIN, X_MAX],
      title: { text: 'Value', font: { size: 13, color: '#4A5568' } },
      showgrid: false, linecolor: '#CBD5E0', zerolinecolor: '#CBD5E0',
      tickfont: { color: '#4A5568', size: TICK_SIZE },
    },
    yaxis: {
      range: [yFloor, yPeak],
      title: { text: 'Probability density', font: { size: 11, color: '#4A5568' } },
      showgrid: false, linecolor: '#CBD5E0', zeroline: false,
      tickfont: { color: '#718096', size: TICK_SIZE },
    },
    plot_bgcolor: '#ffffff', paper_bgcolor: '#ffffff',
    showlegend: true,
    legend: {
      orientation: 'h', x: 0.5, xanchor: 'center', y: 1.07,
      bgcolor: 'rgba(255,255,255,0.85)', font: { size: 10, color: '#4A5568' },
    },
    hovermode: 'closest',
    font: { family: 'Segoe UI, system-ui, sans-serif' },
  };

  Plotly.react('plot', traces, layout, cfg);
}

// ── Event listeners ──────────────────────────────────────────
update();
document.getElementById('n-slider').addEventListener('input', update);
document.getElementById('bin-slider').addEventListener('input', update);
document.getElementById('mu-slider').addEventListener('input', update);
document.getElementById('sigma-slider').addEventListener('input', update);
document.getElementById('resample-btn').addEventListener('click', () => {
  sampleSeed = (sampleSeed * 1664525 + 1013904223) & 0x7fffffff;
  noisePool  = resample();
  update();
});
</script>
</body>
</html>
